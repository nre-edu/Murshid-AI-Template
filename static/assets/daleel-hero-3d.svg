<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients matching the peach/orange/soft blue reference palette -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEADF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD6C2" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B47"/>
      <stop offset="100%" stop-color="#F2511D"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8FA"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF4F8"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Filters for realistic 3D soft shadows -->
    <filter id="shadow3D" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14304A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14304A" flood-opacity="0.06"/>
    </filter>
    <filter id="shadowFloat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#FF5A26" flood-opacity="0.25"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow Circles -->
  <circle cx="260" cy="210" r="170" fill="url(#bgGlow)"/>
  <circle cx="390" cy="110" r="18" fill="#FFCBB3" opacity="0.6"/>
  <circle cx="110" cy="310" r="14" fill="#FFDDCF" opacity="0.7"/>
  <circle cx="430" cy="290" r="10" fill="#BAE6FD" opacity="0.8"/>
  <circle cx="90" cy="120" r="12" fill="#BAE6FD" opacity="0.6"/>

  <!-- Isometric Ground Shadow -->
  <ellipse cx="260" cy="355" rx="190" ry="32" fill="#0F243A" opacity="0.08"/>

  <!-- Back Layer: Stacked Documents / Knowledge Binder (3D Layered) -->
  <g filter="url(#shadow3D)">
    <!-- Base Document 1 -->
    <rect x="130" y="110" width="190" height="230" rx="20" fill="url(#docGrad)" transform="rotate(-8 130 110)"/>
    <line x1="150" y1="170" x2="250" y2="155" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="155" y1="195" x2="270" y2="180" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
    <line x1="160" y1="220" x2="230" y2="210" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <!-- Middle Document 2 with Orange Ribbon -->
    <rect x="180" y="90" width="200" height="240" rx="22" fill="#FFFFFF"/>
    <!-- Folded Corner -->
    <path d="M 340 90 L 380 130 L 340 130 Z" fill="#FFE8DE"/>
    <path d="M 340 90 L 380 130 L 380 90 Z" fill="#F8FAFC" opacity="0.5"/>
    <!-- Content lines on document -->
    <rect x="205" y="125" width="85" height="12" rx="6" fill="url(#orangeGrad)"/>
    <rect x="205" y="155" width="150" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="205" y="175" width="135" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="205" y="195" width="145" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="205" y="215" width="110" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- Front 3D Card: Verified Knowledge Search & AI Shield -->
  <g filter="url(#shadow3D)">
    <rect x="110" y="160" width="220" height="140" rx="24" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2"/>
    
    <!-- Verified Badge Pill -->
    <rect x="130" y="180" width="115" height="28" rx="14" fill="#ECFDF5"/>
    <circle cx="145" cy="194" r="7" fill="#10B981"/>
    <path d="M 142 194 L 144 196 L 148 192" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="198" font-family="Tajawal, sans-serif" font-size="11" font-weight="bold" fill="#047857">مصدر معتمد</text>

    <!-- Excerpt simulated text -->
    <rect x="130" y="222" width="180" height="8" rx="4" fill="#0F172A" opacity="0.8"/>
    <rect x="130" y="238" width="150" height="8" rx="4" fill="#64748B" opacity="0.6"/>
    <rect x="130" y="254" width="165" height="8" rx="4" fill="#94A3B8" opacity="0.5"/>

    <!-- Small folder ID chip -->
    <rect x="130" y="274" width="130" height="16" rx="8" fill="#F8FAFC"/>
    <text x="136" y="285" font-family="monospace" font-size="9" fill="#64748B">ID: 1PI3SJ9BX...Ss0</text>
  </g>

  <!-- Floating 3D Chat Bubble (Orange Brand Accent) -->
  <g filter="url(#shadowFloat)">
    <rect x="290" y="165" width="160" height="95" rx="22" fill="url(#orangeGrad)"/>
    <!-- Chat Tail -->
    <path d="M 330 260 L 315 280 L 350 260 Z" fill="#F2511D"/>
    
    <!-- White sparkle icon -->
    <path d="M 335 195 Q 335 205 345 205 Q 335 205 335 215 Q 335 205 325 205 Q 335 205 335 195 Z" fill="#FFFFFF"/>
    <path d="M 360 188 Q 360 193 365 193 Q 360 193 360 198 Q 360 193 355 193 Q 360 193 360 188 Z" fill="#FFE5D9"/>

    <!-- Simulated text lines inside orange bubble -->
    <rect x="330" y="222" width="95" height="7" rx="3.5" fill="#FFFFFF" opacity="0.95"/>
    <rect x="350" y="235" width="75" height="7" rx="3.5" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Floating 3D Sparkle / AI Search Orb -->
  <g filter="url(#badgeShadow)">
    <circle cx="380" cy="105" r="32" fill="url(#blueAccent)"/>
    <!-- Magnifier icon with Spark -->
    <circle cx="376" cy="101" r="12" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
    <line x1="385" y1="110" x2="395" y2="120" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="376" cy="101" r="4" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Floating Document Indicator Chip -->
  <g filter="url(#shadow3D)">
    <rect x="65" y="230" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="82" cy="247" r="7" fill="#FF7B47"/>
    <path d="M 80 245 L 84 247 L 80 249 Z" fill="#FFFFFF"/>
    <text x="96" y="251" font-family="Tajawal, sans-serif" font-size="11" font-weight="bold" fill="#1E293B">مرشد</text>
  </g>

  <!-- 3D Star / Sparkle Accents -->
  <path d="M 230 70 Q 230 82 242 82 Q 230 82 230 94 Q 230 82 218 82 Q 230 82 230 70 Z" fill="#FFA17A"/>
  <path d="M 120 100 Q 120 108 128 108 Q 120 108 120 116 Q 120 108 112 108 Q 120 108 120 100 Z" fill="#38BDF8"/>
  <path d="M 460 210 Q 460 216 466 216 Q 460 216 460 222 Q 460 216 454 216 Q 460 216 460 210 Z" fill="#FFA17A"/>
</svg>
